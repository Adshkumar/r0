name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci --prefer-online --no-audit --no-fund
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare stable-named copies
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $msi) { throw "No MSI found" }
          if (-not $exe) { throw "No NSIS setup.exe found" }
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item $msi.FullName r0-latest.msi
          Copy-Item $exe.FullName r0-latest-setup.exe
          Copy-Item $msi.FullName "r0-$ver.msi"
          Copy-Item $exe.FullName "r0-$ver-setup.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: r0 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            r0-latest.msi
            r0-latest-setup.exe
            r0-*.msi
            r0-*-setup.exe