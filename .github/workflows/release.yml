name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Prepare stable-named copies
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $msi) { throw "No MSI found." }
          if (-not $exe) { throw "No NSIS setup.exe found." }
          Copy-Item $msi.FullName "r0-latest.msi"
          Copy-Item $exe.FullName "r0-latest-setup.exe"
$ver = "${{ github.ref_name }}".TrimStart("v")
Copy-Item $msi.FullName "r0-$ver.msi"
Copy-Item $exe.FullName "r0-$ver-setup.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: r0 latest release
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            r0-latest.msi
            r0-latest-setup.exe
            r0-*.msi
            r0-*-setup.exe
