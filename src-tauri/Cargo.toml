[package]
name = "r0"
version = "0.18.2"
description = "r0 code editor"
authors = ["Adarsh Kumar"]
edition = "2024"

[lints]
workspace = true

[lib]
name = "r0_text_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.21"
chrono = { version = "0.4.41", features = ["serde"] }
colored = "3.0.0"
crossbeam-channel = "0.5"
dirs = "5.0"
dunce = "1"
ec4rs = "1.2"
env_logger = "0.11.8"
futures-util = "0.3"
r0-runtime = { path = "../crates/runtime" }
r0-tooling = { path = "../crates/tooling" }
r0-lsp = { path = "../crates/lsp" }
r0-remote = { path = "../crates/remote" }
r0-wsl = { path = "../crates/wsl" }
r0-project = { path = "../crates/project" }
r0-version-control = { path = "../crates/version-control" }
r0-extensions = { path = "../crates/extensions" }
r0-browser = { path = "../crates/browser" }
r0-terminal = { path = "../crates/terminal" }
r0-ai = { path = "../crates/ai" }
r0-github = { path = "../crates/github" }
r0-fff-search = { path = "../crates/fff-search" }
r0-debugger = { path = "../crates/debugger" }
r0-docker = { path = "../crates/docker" }
r0-claude-ide = { path = "../crates/claude-ide" }
r0-database = { path = "../crates/database", default-features = false, features = ["sqlite"] }
mimalloc = { version = "0.1", default-features = false }
log = "0.4.27"
percent-encoding = "2"
lsp-types = { version = "0.95", features = ["proposed"] }
regex = "1.10"
reqwest = { workspace = true, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha256 = "1.5"
tar = "0.4"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
keyring = { version = "3.6.3", features = [
  "apple-native",
  "crypto-rust",
  "sync-secret-service",
  "windows-native",
] }
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = { version = "2.8", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2.6"
# Without the default `cookies` feature: the plugin's one cookie jar would replay cookies a
# previewed dev server sets to every later visitor. `unsafe-headers` lets preview links forward
# the visitor's Cookie, Origin and Referer headers to localhost.
tauri-plugin-http = { version = "2.8", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
  "unsafe-headers",
] }
tauri-plugin-notification = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-store = "2.5"
tauri-plugin-updater = "2.13"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
which = "7.0"
# The same wry Tauri runs on; browser tabs use it directly (see src/browser.rs).
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
zip = "9"
tempfile = "3.20.0"
fontdb = "0.23.0"
ttf-parser = "0.25.1"
toml = "0.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-deep-link = "2.6"
tauri-plugin-drag = "2.1.1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"

[dev-dependencies]
r0-test-support = { path = "../crates/test-support" }
tauri = { version = "2.12", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.5"

# Hardware SHA-256 on ARM for checked saves and local history. `sha2-asm` does not build with
# MSVC, so Windows and every other target keep the portable implementation.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "2"

# Window regions that cut browser tabs around workbench UI; the version wry uses.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# Page snapshots for browser tabs; the same versions wry uses.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSDictionary",
  "NSError",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKSnapshotConfiguration",
  "WKWebView",
] }
